version: '3.8'

# ===================================================================
# DOCKER COMPOSE CHO CLINIC MANAGEMENT SYSTEM
# ===================================================================
# Dự án: Hệ thống quản lý phòng khám thần kinh Khánh An
# Components: React Frontend + .NET Backend
# Network: clinic-network
# Ports: 3000 (FE), 5050 (BE)
# ===================================================================

services:
  # ===============================================
  # FRONTEND SERVICE - REACT APP
  # ===============================================
  clinic-frontend:
    image: quanghd/fe:latest
    container_name: clinic-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5050
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - clinic-backend
    labels:
      - "com.clinic.service=frontend"
      - "com.clinic.description=React Frontend cho hệ thống quản lý phòng khám"

  # ===============================================  
  # BACKEND SERVICE - .NET API
  # ===============================================
  clinic-backend:
    image: quanghd/be:latest
    container_name: clinic-backend
    ports:
      - "5050:5050"
    restart: unless-stopped
    environment:
      # ASP.NET Core Configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5050
      - TZ=Asia/Ho_Chi_Minh
      
      # Database Configuration
      - DB_SERVER=70.153.24.53
      - DB_NAME=KhanhAnNeurologyClinic
      - DB_USER=sa
      - DB_PASSWORD=Quangtung1526.
      
      # JWT Configuration
      - JWT_SECRET_KEY=CWY}UMxv3/<?Pq&S!]HK6^2.-9s[RdnA
      - JWT_ISSUER=SEP490_BE
      - JWT_AUDIENCE=SEP490_FE
      - JWT_EXPIRATION_HOURS=24
      
      # Redis Configuration
      - REDIS_CONNECTION_STRING=host.docker.internal:6379,abortConnect=false
      
      # App Configuration
      - BACKEND_URL=http://localhost:5050
      
      # SMTP Configuration
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_EMAIL=quangtranminh.work@gmail.com
      - SMTP_PASSWORD=orke qwel vfzc uyci
      
      # CORS Configuration
      - CORS__AllowedOrigins=http://localhost:3000,http://host.docker.internal:3000
      
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.clinic.service=backend"
      - "com.clinic.description=.NET API cho hệ thống quản lý phòng khám"

# ===============================================
# NETWORKS
# ===============================================
networks:
  clinic-network:
    name: clinic-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===============================================
# VOLUMES (for future use)
# ===============================================
volumes:
  clinic-data:
    name: clinic-data
    driver: local 