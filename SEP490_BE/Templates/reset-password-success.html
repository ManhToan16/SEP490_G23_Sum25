<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thành công</title>
    <style>
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .message-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

            .message-box h3 {
                color: #28a745;
                font-size: 24px;
                margin-bottom: 10px;
            }

        .icon {
            font-size: 40px;
            color: #28a745;
            margin-bottom: 15px;
        }

        .message-box p {
            font-size: 15px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="icon">✔️</div>
        <h3>Đặt lại mật khẩu thành công!</h3>
        <p>Bạn có thể đóng cửa sổ này và đăng nhập lại.</p>
    </div>
</body>
</html>
