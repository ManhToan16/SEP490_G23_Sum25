<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Đặt lại mật khẩu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            background: linear-gradient(135deg, #007bff, #00c6ff);
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

            .container h2 {
                margin-bottom: 20px;
                color: #333;
            }

        .logo {
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 92%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

            button:hover {
                background-color: #0056b3;
            }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 480px) {
            .container {
                margin: 30px 15px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Đặt lại mật khẩu</h2>
        <form method="POST" action="/api/Auth/ResetPassword">
            <input type="hidden" name="token" value="{{token}}" />
            <input type="password"
                   name="newPassword"
                   placeholder="Nhập mật khẩu mới"
                   required
                   pattern=".{8,}"
                   title="Mật khẩu phải có ít nhất 8 ký tự" />

            <button type="submit">Xác nhận</button>
        </form>
        <div class="footer">© 2025 Khanh An Neurology Clinic</div>
    </div>
</body>
</html>
