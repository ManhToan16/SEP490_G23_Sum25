<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Đặt lại mật khẩu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            background: linear-gradient(to right, #1e3c72, #2a5298);
            font-family: "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
        }

        input[type="password"] {
            width: 94%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

            button:hover {
                background-color: #0056b3;
            }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset password</h2>
        <form id="resetForm">
            <input type="hidden" name="token" value="{{token}}" />
            <input type="password"
                   name="newPassword"
                   placeholder="Nhập mật khẩu mới"
                   required
                   pattern="^\S{8,}$"
                   title="Password has to have at least 8 characters and does not include whitespace." />
            <button type="submit">Confirm</button>
        </form>
        <div id="successMsg" class="message success" style="display:none;"></div>
        <div id="errorMsg" class="message error" style="display:none;"></div>
        <div class="footer">© 2025 Khanh An Neurology Clinic</div>
    </div>

    <script>
        document.getElementById("resetForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const form = e.target;
            const token = form.token.value;
            const newPassword = form.newPassword.value;

            const successDiv = document.getElementById("successMsg");
            const errorDiv = document.getElementById("errorMsg");
            successDiv.style.display = "none";
            errorDiv.style.display = "none";
            successDiv.textContent = "";
            errorDiv.textContent = "";

            try {
                const response = await fetch("/api/Auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        token,
                        newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = data.message || "Reset password successful!";
                    successDiv.style.display = "block";
                    form.reset();
                } else {
                    errorDiv.textContent = data.message || "Oops...Something went wrong!!!";
                    errorDiv.style.display = "block";
                }
            } catch (err) {
                errorDiv.textContent = "Oops...Something went wrong!!!";
                errorDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
