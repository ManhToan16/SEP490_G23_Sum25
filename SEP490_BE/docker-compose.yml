version: '3.8'

services:
  # ===================================================================
  # FRONTEND SERVICE - KHANH AN NEUROLOGY CLINIC
  # ===================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanghd/fe:latest
    container_name: clinic-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5050
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend
    networks:
      - clinic-network

  # ===================================================================
  # BACKEND SERVICE - KHANH AN NEUROLOGY CLINIC API
  # ===================================================================
  backend:
    image: quanghd/be:latest
    container_name: clinic-backend
    ports:
      - "5050:5050"
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5050
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=KhanhAnClinic;User Id=sa;Password=YourStrong@Passw0rd123;TrustServerCertificate=true;MultipleActiveResultSets=true;
      - JwtSettings__SecretKey=KhanhAnNeurologyClinic2024SecretKeyForJWTAuthentication12345
      - JwtSettings__Issuer=SEP490_BE
      - JwtSettings__Audience=SEP490_FE
      - JwtSettings__ExpiryInHours=24
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - clinic-network



# ===================================================================
# NETWORKS
# ===================================================================
networks:
  clinic-network:  
    driver: bridge
    name: clinic-network 