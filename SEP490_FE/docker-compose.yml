version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanghd/fe:latest
    container_name: clinic-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge
    name: clinic-network 